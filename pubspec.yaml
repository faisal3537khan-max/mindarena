name: mindarena
description: "MindArena — The Arena of Minds. Competitive mini-game platform."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  google_fonts: ^6.3.2
  shared_preferences: ^2.5.3
  audioplayers: ^6.5.1
  flutter_animate: ^4.5.2
  confetti: ^0.8.0
  uuid: ^4.5.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sfx/
