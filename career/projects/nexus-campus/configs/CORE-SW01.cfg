hostname CORE-SW01
!
service password-encryption
enable secret 9 $9$NexusCampusCore01
!
ip domain-name nexus.lab
crypto key generate rsa modulus 2048
ip ssh version 2
!
spanning-tree mode rapid-pvst
spanning-tree vlan 1-99 priority 4096
!
vlan 10
 name USERS
vlan 20
 name VOICE
vlan 30
 name SERVERS
vlan 40
 name GUEST
vlan 50
 name IOT
vlan 99
 name MGMT
!
interface Loopback0
 description ROUTER-ID
 ip address 10.255.255.1 255.255.255.255
!
interface Vlan99
 description MGMT
 ip address 10.10.99.2 255.255.255.0
 no ip proxy-arp
!
interface Port-channel1
 description MLAG-CORE-SW02
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,40,50,99
!
interface GigabitEthernet1/0/1
 description to-CORE-SW02-Po1-member
 channel-group 1 mode active
!
interface GigabitEthernet1/0/2
 description to-CORE-SW02-Po1-member
 channel-group 1 mode active
!
interface GigabitEthernet1/1/1
 description to-DIST-SW01
 no switchport
 ip address 10.255.0.1 255.255.255.252
 ip ospf network point-to-point
 ip ospf hello-interval 1
!
interface GigabitEthernet1/1/2
 description to-DIST-SW02
 no switchport
 ip address 10.255.0.5 255.255.255.252
 ip ospf network point-to-point
!
interface GigabitEthernet1/1/3
 description to-FW01-inside
 no switchport
 ip address 10.255.0.17 255.255.255.252
!
router ospf 1
 router-id 10.255.255.1
 network 10.255.0.0 0.0.0.3 area 0
 network 10.255.0.4 0.0.0.3 area 0
 network 10.255.255.1 0.0.0.0 area 0
 passive-interface default
 no passive-interface GigabitEthernet1/1/1
 no passive-interface GigabitEthernet1/1/2
!
ip access-list standard MGMT-ONLY
 permit 10.10.99.0 0.0.0.255
 deny any log
!
line vty 0 4
 transport input ssh
 login local
 access-class MGMT-ONLY in
!
username netadmin privilege 15 secret 9 $9$NexusAdmin
aaa new-model
!
ntp server 10.10.30.10
logging host 10.10.30.20
!
end
