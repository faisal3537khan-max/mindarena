hostname DIST-SW01
!
service password-encryption
enable secret 9 $9$NexusCampusDist01
!
ip domain-name nexus.lab
ip ssh version 2
!
spanning-tree mode rapid-pvst
spanning-tree vlan 10,20,30,40,50,99 priority 8192
!
vlan 10
 name USERS
vlan 20
 name VOICE
vlan 30
 name SERVERS
vlan 40
 name GUEST
vlan 50
 name IOT
vlan 99
 name MGMT
!
ip dhcp snooping
ip dhcp snooping vlan 10,20,40,50
ip arp inspection vlan 10,20,40,50
!
interface Loopback0
 ip address 10.255.255.11 255.255.255.255
!
interface Vlan10
 description USERS-SVI
 ip address 10.10.10.2 255.255.254.0
 standby 10 ip 10.10.10.1
 standby 10 priority 110
 standby 10 preempt
 ip helper-address 10.10.30.15
 no ip proxy-arp
!
interface Vlan20
 description VOICE-SVI
 ip address 10.10.20.2 255.255.255.0
 standby 20 ip 10.10.20.1
 standby 20 priority 110
 standby 20 preempt
 ip helper-address 10.10.30.15
!
interface Vlan30
 description SERVERS-SVI
 ip address 10.10.30.2 255.255.255.0
 standby 30 ip 10.10.30.1
 standby 30 priority 110
 standby 30 preempt
!
interface Vlan40
 description GUEST-SVI
 ip address 10.10.40.2 255.255.255.0
 standby 40 ip 10.10.40.1
 standby 40 priority 110
 standby 40 preempt
 ip access-group GUEST-IN in
 ip helper-address 10.10.30.15
!
interface Vlan50
 description IOT-SVI
 ip address 10.10.50.2 255.255.255.0
 standby 50 ip 10.10.50.1
 standby 50 priority 110
 standby 50 preempt
 ip helper-address 10.10.30.15
!
interface Vlan99
 description MGMT
 ip address 10.10.99.11 255.255.255.0
 standby 99 ip 10.10.99.1
 standby 99 priority 110
 standby 99 preempt
!
interface GigabitEthernet1/1/1
 description to-CORE-SW01
 no switchport
 ip address 10.255.0.2 255.255.255.252
 ip ospf network point-to-point
 ip dhcp snooping trust
!
interface GigabitEthernet1/1/2
 description to-CORE-SW02
 no switchport
 ip address 10.255.0.10 255.255.255.252
 ip ospf network point-to-point
 ip dhcp snooping trust
!
interface GigabitEthernet1/1/3
 description to-DIST-SW02-peer-link
 no switchport
 ip address 10.255.0.13 255.255.255.252
 ip dhcp snooping trust
!
interface range GigabitEthernet1/0/1-24
 description downlink-to-ACCESS
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,40,50,99
 ip dhcp snooping trust
 spanning-tree portfast trunk
 spanning-tree bpduguard enable
!
ip access-list extended GUEST-IN
 remark Guest may reach DNS/DHCP and the internet via FW — not campus servers
 permit udp any any eq 53
 permit udp any any eq 67
 permit tcp any any eq 53
 deny ip any 10.10.10.0 0.0.1.255
 deny ip any 10.10.20.0 0.0.0.255
 deny ip any 10.10.30.0 0.0.0.255
 deny ip any 10.10.50.0 0.0.0.255
 deny ip any 10.10.99.0 0.0.0.255
 permit ip any any
!
router ospf 1
 router-id 10.255.255.11
 network 10.255.0.0 0.0.0.3 area 0
 network 10.255.0.8 0.0.0.3 area 0
 network 10.255.0.12 0.0.0.3 area 0
 network 10.255.255.11 0.0.0.0 area 0
 passive-interface default
 no passive-interface GigabitEthernet1/1/1
 no passive-interface GigabitEthernet1/1/2
 no passive-interface GigabitEthernet1/1/3
!
ip access-list standard MGMT-ONLY
 permit 10.10.99.0 0.0.0.255
 deny any log
!
line vty 0 4
 transport input ssh
 login local
 access-class MGMT-ONLY in
!
username netadmin privilege 15 secret 9 $9$NexusAdmin
ntp server 10.10.30.10
logging host 10.10.30.20
!
end
