hostname ACCESS-SW01
!
service password-encryption
enable secret 9 $9$NexusCampusAccess01
!
ip domain-name nexus.lab
ip ssh version 2
!
spanning-tree mode rapid-pvst
spanning-tree portfast default
spanning-tree portfast bpduguard default
!
vlan 10
 name USERS
vlan 20
 name VOICE
vlan 40
 name GUEST
vlan 50
 name IOT
vlan 99
 name MGMT
!
ip dhcp snooping
ip dhcp snooping vlan 10,20,40,50
ip arp inspection vlan 10,20,40,50
!
interface Vlan99
 description MGMT
 ip address 10.10.99.21 255.255.255.0
!
ip default-gateway 10.10.99.1
!
interface GigabitEthernet1/0/48
 description uplink-DIST-SW01
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,40,50,99
 ip dhcp snooping trust
 ip arp inspection trust
 spanning-tree guard root
!
interface range GigabitEthernet1/0/1-40
 description USER-ACCESS
 switchport mode access
 switchport access vlan 10
 switchport voice vlan 20
 switchport port-security
 switchport port-security maximum 3
 switchport port-security violation restrict
 switchport port-security aging time 2
 spanning-tree portfast
 spanning-tree bpduguard enable
 ip dhcp snooping limit rate 15
!
interface range GigabitEthernet1/0/41-44
 description GUEST-AP
 switchport mode access
 switchport access vlan 40
 switchport port-security
 switchport port-security maximum 8
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface range GigabitEthernet1/0/45-47
 description IOT
 switchport mode access
 switchport access vlan 50
 switchport port-security
 switchport port-security maximum 1
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
!
ip access-list standard MGMT-ONLY
 permit 10.10.99.0 0.0.0.255
 deny any log
!
line vty 0 4
 transport input ssh
 login local
 access-class MGMT-ONLY in
!
username netadmin privilege 15 secret 9 $9$NexusAdmin
ntp server 10.10.30.10
logging host 10.10.30.20
!
end
