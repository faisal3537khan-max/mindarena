hostname EDGE-RTR01
!
service password-encryption
enable secret 9 $9$NexusCampusEdge01
!
ip domain-name nexus.lab
ip ssh version 2
!
interface Loopback0
 ip address 10.255.255.101 255.255.255.255
!
interface GigabitEthernet0/0
 description ISP-A
 ip address 203.0.113.2 255.255.255.252
 ip nat outside
 no ip proxy-arp
!
interface GigabitEthernet0/1
 description to-FW01-untrust
 ip address 192.0.2.1 255.255.255.252
 ip nat inside
!
ip nat inside source list NAT-INSIDE interface GigabitEthernet0/0 overload
ip access-list standard NAT-INSIDE
 permit 10.10.10.0 0.0.1.255
 permit 10.10.20.0 0.0.0.255
 permit 10.10.30.0 0.0.0.255
 permit 10.10.40.0 0.0.0.255
 deny any
!
ip route 0.0.0.0 0.0.0.0 203.0.113.1
!
router ospf 1
 router-id 10.255.255.101
 network 192.0.2.0 0.0.0.3 area 0
 network 10.255.255.101 0.0.0.0 area 0
 default-information originate metric 10
 passive-interface default
 no passive-interface GigabitEthernet0/1
!
ip access-list standard MGMT-ONLY
 permit 10.10.99.0 0.0.0.255
 deny any log
!
line vty 0 4
 transport input ssh
 login local
 access-class MGMT-ONLY in
!
username netadmin privilege 15 secret 9 $9$NexusAdmin
ntp server 10.10.30.10
!
end
